default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  # DATABASE_URL が設定されている場合はそちらを優先
  url: <%= ENV["DATABASE_URL"] %>

development:
  <<: *default
  database: politician_monitoring_development

test:
  <<: *default
  database: politician_monitoring_test

production:
  <<: *default
  # 本番は DATABASE_URL 必須（RDS の接続文字列を設定）
  url: <%= ENV.fetch("DATABASE_URL") { raise "DATABASE_URL is not set" } %>
