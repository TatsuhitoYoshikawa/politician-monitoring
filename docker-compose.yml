version: "3.9"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: politician_monitoring_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    command: >
      bash -c "rm -f tmp/pids/server.pid &&
               bundle exec rails db:create db:migrate db:seed &&
               bundle exec rails server -b 0.0.0.0 -p 3000"
    volumes:
      - ./backend:/app
      - bundle_cache:/usr/local/bundle
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/politician_monitoring_development
      RAILS_ENV: development
      SCRAPER_BEARER_TOKEN: ${SCRAPER_BEARER_TOKEN:-dev-scraper-token-changeme}

  scraper:
    build: ./scraper
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./scraper:/app
    ports:
      - "8000:8000"
    depends_on:
      - backend
    environment:
      RAILS_API_URL: http://backend:3000
      RAILS_BEARER_TOKEN: ${SCRAPER_BEARER_TOKEN:-dev-scraper-token-changeme}

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  bundle_cache:
